<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tori Lee</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Tori Lee — Technical Customer Success Associate. Customer success, Data Center to Cloud migrations, and AI automation with Claude." />
    <link rel="canonical" href="https://tori-lee.com/" />

    <!-- Browser tab + home-screen icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2a4b36" />

    <!-- Link previews (LinkedIn, Slack, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tori Lee" />
    <meta property="og:title" content="Tori Lee — Technical Customer Success Associate" />
    <meta property="og:description" content="Customer success, Data Center to Cloud migrations, and AI automation with Claude. See my projects and experience." />
    <meta property="og:url" content="https://tori-lee.com/" />
    <meta property="og:image" content="https://tori-lee.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tori Lee, Technical Customer Success Associate" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tori Lee — Technical Customer Success Associate" />
    <meta name="twitter:description" content="Customer success, Data Center to Cloud migrations, and AI automation with Claude." />
    <meta name="twitter:image" content="https://tori-lee.com/og-image.jpg" />

    <!-- Apply saved or system light/dark mode before the page paints (no flash) -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>

    <!-- Fonts for monogram + body text -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
  </head>
  <body class="min-h-screen antialiased bg-brand-white text-brand-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
